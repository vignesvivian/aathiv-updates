<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Open Aathiv Site</title>
<style>body{font-family:system-ui,sans-serif;background:#051217;color:#eef1f2;margin:0;display:grid;place-items:center;min-height:100vh;padding:24px;text-align:center}a{display:inline-block;margin-top:16px;padding:14px 22px;border-radius:12px;background:#3298b7;color:#04100f;font-weight:700;text-decoration:none}p{opacity:.8;line-height:1.5}</style></head>
<body><div><h2>Opening Aathiv Site...</h2><p>If the app does not open, tap the button. You need the Aathiv Site app installed on this phone.</p><a id="go" href="#">Open the app</a></div>
<script>
var to=(new URLSearchParams(location.search).get('to')||'me').replace(/[^a-z0-9-]/g,'');
var intent='intent://open/'+to+'#Intent;scheme=aathiv;package=in.aathiv.site;end';
document.getElementById('go').href=intent;
if(/Android/i.test(navigator.userAgent)) location.href=intent;
</script></body></html>
